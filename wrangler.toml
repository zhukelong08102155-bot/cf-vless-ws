# 复制为 wrangler.toml 后填入你自己的值。
# 不要把填好真实值的 wrangler.toml 提交到公开仓库。

name = "cf-vless-ws"
main = "src/index.js"
compatibility_date = "2026-08-30"

# wrangler whoami 可以查到。也可以整行删掉，用 wrangler 交互式选择账号。
account_id = "YOUR_ACCOUNT_ID"

# nodejs_compat 是 cloudflare:sockets 的 connect() 所必需的
compatibility_flags = ["nodejs_compat"]

# Workers 免费计划不需要付费即可使用 Durable Objects，但本项目用不到，
# 下面这段只是说明：若你以后要加 DO，迁移必须写 new_sqlite_classes（不是
# new_classes），否则报 code: 10097。

[vars]
# 客户端凭证。用 uuidgen 或 python -c "import uuid;print(uuid.uuid4())" 生成。
UUID = "2a8141db-b67f-4443-b739-ce4f17067aa5"

# 隧道路径。随机长字符串，别用默认值。
# 路径校验在代码里是前置的：非此路径一律 404，等于对外隐身。
WS_PATH = "/nWyGScxCqvK864TYEN"

# ---------- 可选：挂自定义域名 ----------
# 强烈建议挂。workers.dev 域名有时会被干扰，自定义域更稳。
# 前置条件：
#   1. 该域名的 DNS 必须托管在 Cloudflare
#   2. 必须是子域（如 egress.example.com），不支持裸域（example.com）
#   3. 免费计划即可
#
# 方法 A：Dashboard
#   Workers & Pages -> 选你的 Worker -> Settings -> Domains & Routes
#   -> Custom Domains -> Add -> 填子域 -> 自动建 DNS 记录并签发证书
#   等 1-3 分钟状态变 Active
#
# 方法 B：写进配置（见下方注释块），然后 wrangler deploy
#
# [[routes]]
# pattern = "egress.example.com"
# custom_domain = true
